/* CAN2_debug_rx.ini */ 

DEFINE BUTTON "SAFE","SendMessage(1)"
DEFINE BUTTON "DANGER","SendMessage(2)"
DEFINE BUTTON "WARNING","SendMessage(3)"
DEFINE BUTTON "TEMP","SendMessage(4)"
DEFINE BUTTON "GAS","SendMessage(5)"
DEFINE BUTTON "GAS-N","SendMessage(6)"
DEFINE BUTTON "FIRE","SendMessage(7)"
DEFINE BUTTON "FIRE-N","SendMessage(8)"

func void SendMessage(unsigned char i)
{
	switch(i)
	{
		case 1: 
					CAN2ID=0x102;
					CAN2L =4;
					CAN2B0=0x11;
					CAN2B1=0x22;
					CAN2B2=0x33;
					CAN2B3=0x44;
					CAN2IN=1;//send data frame of 11bit id
					break;
		case 2: 
					CAN2ID=0x102;
					CAN2L =4;
					CAN2B0=0x01;
					CAN2B1=0x00;
					CAN2B2=0x00;
					CAN2B3=0x00;
					CAN2IN=1;//send data frame of 11bit id
					break;
		case 3: 
					CAN2ID=0x102;
					CAN2L =4;
					CAN2B0=0x12;
					CAN2B1=0x00;
					CAN2B2=0x00;
					CAN2B3=0x00;
					CAN2IN=1;//send data frame of 11bit id
					break;
		case 4: 
					CAN2ID=0x104;
					CAN2L =4;
					CAN2B0=0x5D;
					CAN2B1=0x00;
					CAN2B2=0x00;
					CAN2B3=0x00;
					CAN2IN=1;//send data frame of 11bit id
					break;
		case 5: 
					CAN2ID=0x105;
					CAN2L =4;
					CAN2B0=0x01;
					CAN2B1=0x00;
					CAN2B2=0x00;
					CAN2B3=0x00;
