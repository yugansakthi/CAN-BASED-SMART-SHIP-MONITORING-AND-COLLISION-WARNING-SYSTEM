					break;
		case 6: 
					CAN2ID=0x105;
					CAN2L =4;
					CAN2B0=0x00;
					CAN2B1=0x00;
					CAN2B2=0x00;
					CAN2B3=0x00;
					CAN2IN=1;//send data frame of 11bit id
					break;
		case 7: 
					CAN2ID=0x106;
					CAN2L =4;
					CAN2B0=0x01;
					CAN2B1=0x00;
					CAN2B2=0x00;
					CAN2B3=0x00;
					CAN2IN=1;//send data frame of 11bit id
					break;
		case 8: 
					CAN2ID=0x106;
					CAN2L =4;
					CAN2B0=0x00;
					CAN2B1=0x00;
					CAN2B2=0x00;
					CAN2B3=0x00;
					CAN2IN=1;//send data frame of 11bit id
					break;
	}
}


